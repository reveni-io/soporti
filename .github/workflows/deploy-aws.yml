name: Deploy to AWS

# Replaces DigitalOcean App Platform's deploy-on-push for both halves of this
# repo: the Express server (a container) and the Vite SPA (static hosting).
#
# Deploys run only on push to main and on manual dispatch, both of which
# require write access. There are no pull-request or fork-triggered deploys.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  statuses: write
  pull-requests: write
  issues: write

jobs:
  # server/ — Express + OpenAI Agents SDK.
  #
  # build_context is server/, not the repo root: server/Dockerfile COPYs
  # ./package.json, ./src and ./drizzle relative to the context.
  server:
    uses: reveni-io/infra-deploy/.github/workflows/deploy-ecs.yml@main
    with:
      ecr_repository: soporti-server
      ecs_service_suffix: soporti-server
      dockerfile: server/Dockerfile
      build_context: server
      auto_deploy_environments: '["prod"]'

  # client/ — Vite SPA.
  #
  # The shared workflow has no working_directory input, but install and build
  # run from the repo root and build_dir is used as given, so a monorepo is
  # driven through it with npm's --prefix.
  #
  # VITE_API_URL is absolute because the SPA and the API are served from
  # different origins.
  client:
    uses: reveni-io/infra-deploy/.github/workflows/deploy-spa-s3.yml@main
    with:
      component: soporti
      package_manager: npm
      install_command: npm ci --prefix client
      build_command: npm run build --prefix client
      build_dir: client/dist
      auto_deploy_environments: '["prod"]'
      build_env: |
        {
          "prod": {
            "VITE_API_URL": "https://soporti-server.reveni.io",
            "VITE_GOOGLE_CLIENT_ID": "439011875043-hsichluc2on2gl91n2l6b8b2l1aua4pi.apps.googleusercontent.com"
          }
        }
