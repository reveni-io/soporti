version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # eslint-plugin-react still declares a peer of eslint ^9, so an eslint 10 PR
    # cannot install; drop this once the plugin supports eslint 10.
    ignore:
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
